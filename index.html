<style>
:root{
  --bg:#EDEFEA; --surface:#FFFFFF; --ink:#15211A; --muted:#55655A; --line:#D3D9D1;
  --accent:#0B7A26; --accent-soft:#E1F2E2; --red:#C8211A;
  --board:#0E4A1D; --board-edge:#08331300; --plate:#FAFAF6; --plate-ink:#111A13; --plate-dim:#8A968C;
  --font:"Archivo", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C150F; --surface:#142019; --ink:#E6ECE6; --muted:#98A89C; --line:#25352A;
    --accent:#5AD26B; --accent-soft:#183622; --red:#FF5A4E;
    --board:#0A3A16; --plate:#F1F2EC; --plate-ink:#111A13; --plate-dim:#7D897F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C150F; --surface:#142019; --ink:#E6ECE6; --muted:#98A89C; --line:#25352A;
  --accent:#5AD26B; --accent-soft:#183622; --red:#FF5A4E;
  --board:#0A3A16; --plate:#F1F2EC; --plate-ink:#111A13; --plate-dim:#7D897F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand img{width:44px;height:auto;display:block}
.brand b{font-weight:800;font-stretch:112%;font-size:18px;line-height:1.05;letter-spacing:.01em}
.brand small{display:block;font-weight:500;font-stretch:100%;font-size:13px;color:var(--muted);letter-spacing:0}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
@media (max-width:720px){
  .top-inner{flex-wrap:wrap;gap:8px;padding:10px 14px 6px}
  nav{margin-left:0;width:100%}
  nav a{padding:7px 12px}
}

main{max-width:1100px;margin:0 auto;padding:28px 20px 64px}
@media (max-width:720px){main{padding:20px 14px 48px}}
h1{font-weight:850;font-stretch:118%;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0 0 8px;letter-spacing:-.005em}
h2{font-weight:750;font-stretch:110%;font-size:24px;line-height:1.15;margin:0}
.lede{color:var(--muted);max-width:62ch;margin:0 0 24px}

/* Provisional notice */
.notice{border-left:4px solid var(--red);background:var(--surface);padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 24px;max-width:78ch;font-size:15px}
.notice strong{color:var(--red)}

/* Leaderboard — the manual golf board */
.board{background:var(--board);border-radius:6px;padding:14px;box-shadow:inset 0 0 0 6px #0003, 0 1px 0 #fff2;}
.board-head{display:flex;align-items:center;gap:14px;padding:6px 6px 14px;color:#fff}
.board-head img{width:52px}
.board-head .t1{font-weight:850;font-stretch:122%;font-size:clamp(17px,2.6vw,24px);line-height:1.05;letter-spacing:.02em;text-transform:uppercase}
.board-head .t2{font-size:14px;opacity:.8;font-stretch:100%}
.board-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.lb{border-collapse:separate;border-spacing:4px;min-width:760px;width:100%}
.lb th{color:#fff;font-weight:700;font-stretch:90%;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:4px 2px;text-align:center}
.lb th.pl{text-align:left;padding-left:10px}
.lb th abbr{text-decoration:none;cursor:help}
.lb th.tbc{opacity:.5}
.lb td{background:var(--plate);color:var(--plate-ink);text-align:center;font-weight:700;font-stretch:85%;font-size:18px;height:38px;padding:0 6px;border-radius:2px;font-variant-numeric:tabular-nums;box-shadow:inset 0 -2px 0 #0000001a}
.lb td.pos{width:52px;color:var(--plate-ink)}
.lb td.pl{text-align:left;padding-left:10px;text-transform:uppercase;font-stretch:80%;letter-spacing:.02em;white-space:nowrap;position:sticky;left:0;z-index:1}
.lb td.pl button{all:unset;cursor:pointer}
.lb td.pl button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.lb td.empty{color:transparent}
.lb td.empty::after{content:"";display:block;width:10px;height:2px;margin:0 auto;background:var(--plate-dim);opacity:.5}
.lb td.tot{color:var(--red);font-size:21px;font-weight:850;width:64px}
.lb tr.lead td.tot{background:var(--red);color:#fff}
.lb tr.detail td{background:#ffffff14;color:#fff;text-align:left;font-weight:500;font-stretch:100%;font-size:14px;height:auto;padding:10px 12px;box-shadow:none;text-transform:none}
.lb tr.detail ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px}
.lb tr.detail li b{font-weight:700}
@media (max-width:640px){.lb .oc{display:none} table.lb{min-width:0} .lb td.pl{position:static;white-space:normal;font-size:15px;line-height:1.2;padding-top:6px;padding-bottom:6px}}
.lb td.unk{color:var(--plate-dim);background:#ffffffc0;font-weight:500}
.lb td.tot.part{color:#8a3a35}
.board-foot{color:#ffffffcc;font-size:13px;padding:10px 6px 2px}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-top:36px}
.rules h3{font-size:16px;font-weight:750;margin:0 0 6px}
.rules p,.rules ol{margin:0;color:var(--muted);font-size:15px}
.rules ol{padding-left:22px}

/* Results */
.outing{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin:0 0 18px}
.outing header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
.outing .meta{color:var(--muted);font-size:15px}
.tag{display:inline-block;font-size:13px;font-weight:650;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:transparent;border:1px solid var(--red);color:var(--red)}
table.res{width:100%;border-collapse:collapse;font-size:16px}
.res th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.res td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.res tr:last-child td{border-bottom:0}
.res .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .p{width:44px;font-weight:700}
.res .team{color:var(--muted);font-size:14px;margin-top:2px}
.res .cup{color:var(--accent);font-weight:700}
.outing .notes{margin:14px 0 0;color:var(--muted);font-size:15px}
.prizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 20px;margin:0;padding:0;list-style:none}
.prizes li{border-bottom:1px solid var(--line);padding:7px 0}
.prizes span{display:block;font-size:13px;color:var(--muted)}

/* Outings timeline */
ol.season{list-style:none;margin:0;padding:0;border-left:3px solid var(--line);margin-left:14px}
ol.season li{position:relative;padding:0 0 26px 30px}
ol.season li::before{content:attr(data-n);position:absolute;left:-17px;top:0;width:31px;height:31px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;border:3px solid var(--bg)}
ol.season li.tbc::before{background:var(--surface);color:var(--muted);border-color:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}
ol.season .when{font-size:14px;color:var(--muted);font-weight:600}
ol.season h3{margin:2px 0 4px;font-size:21px;font-weight:750;font-stretch:108%}
ol.season p{margin:0;font-size:15px;color:var(--muted)}
ol.season p b{color:var(--ink);font-weight:650}

/* Members */
.search{width:100%;max-width:380px;font:inherit;font-size:16px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);margin:0 0 18px}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 28px}
.m{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.m .ini{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:15px;display:grid;place-items:center;flex-shrink:0}
.m .who{flex:1;min-width:0}
.m .name{font-weight:650}
.m .sub{font-size:13px;color:var(--muted)}
.m .pts{text-align:right;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
.m .pts small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.empty-state{color:var(--muted);padding:20px 0}

/* Home */
.hero{display:flex;align-items:center;gap:28px;margin:4px 0 22px}
.hero img{width:clamp(96px,16vw,150px);flex-shrink:0}
.hero-title{font-size:clamp(40px,8vw,76px);font-weight:900;font-stretch:125%;line-height:.92;letter-spacing:-.01em;color:var(--accent);margin:0 0 12px}
.hero-title span{display:block;font-size:.36em;font-weight:700;font-stretch:125%;letter-spacing:.32em;color:var(--red);margin-top:8px}
@media (max-width:560px){.hero{flex-direction:column;align-items:flex-start;gap:14px}}
.live{background:var(--red);color:#fff;padding:12px 16px;border-radius:8px;margin:0 0 22px;max-width:78ch}
.home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start}
@media (max-width:820px){.home-grid{grid-template-columns:1fr}}
.next{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:10px;padding:22px 24px}
.next h2{font-size:16px;color:var(--muted);font-weight:650;font-stretch:100%}
.next-venue{font-size:clamp(36px,6vw,54px);font-weight:900;font-stretch:120%;line-height:1;margin:6px 0 6px}
.next-when{margin:0 0 16px;font-weight:600}
.next dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin:0 0 18px}
.next dt{font-size:13px;color:var(--muted)}
.next dd{margin:0;font-weight:600}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:999px}
:root[data-theme="dark"] .btn{color:#0C150F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0C150F}}
table.lb.mini-lb{min-width:0}
.mini-lb td.pl a{color:inherit;text-decoration:none}
.board-link{display:inline-block;color:#fff;font-weight:600;padding:10px 6px 2px}
.home-row{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:34px}
@media (max-width:820px){.home-row{grid-template-columns:1fr}}
.home-row h2,.thanks h2{margin-bottom:6px}
.home-row .meta{color:var(--muted);margin:0}
blockquote{margin:8px 0 0;padding:0 0 0 16px;border-left:4px solid var(--accent);font-size:18px;line-height:1.45;max-width:52ch}
blockquote cite{display:block;font-style:normal;font-size:14px;color:var(--muted);margin-top:8px}
.thanks{margin-top:34px}
.thanks ul{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 28px}
.thanks li{border-bottom:1px solid var(--line);padding:8px 0}
.thanks li span{display:block;color:var(--muted);font-size:15px}
.plink{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
.plink:hover{color:var(--accent)}
/* Outings extras */
.tag.now{background:var(--red);color:#fff}
ol.season li.is-now::before{background:var(--red);color:#fff;box-shadow:none}
ol.season li.is-next::before{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent)}
ol.season h3 small{font-size:14px;font-weight:500;color:var(--muted);font-stretch:100%}
ol.season .tag{vertical-align:middle;margin-left:6px}
/* Members as links */
a.m{color:inherit;text-decoration:none}
a.m:hover .name{color:var(--accent)}
/* Player */
.crumb{margin:0 0 6px;font-size:15px}
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:640px;margin:0 0 24px}
.pstats div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.pstats b{display:block;font-size:28px;font-weight:850;font-stretch:110%;color:var(--red);line-height:1.1}
.pstats span{font-size:13px;color:var(--muted)}
@media (max-width:520px){.pstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.season-t{max-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.season-t tr.dim td{color:var(--muted)}
/* Honours */
.honours{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:10px}
.honour{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:10px;padding:18px 20px}
.honour h2{font-size:19px;margin-bottom:8px}
footer{max-width:1100px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){
  .lb tbody tr.row{animation:flip .35s ease-out both}
  @keyframes flip{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
</style>
</head>

/* ===== SCORING ===== */
const ord = n => n + (["th","st","nd","rd"][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)] || "th");
const D = s => new Date(s+"T12:00:00");
const fmtDate = (o, long) => {
  if (!o.date) return o.dateText || "Date to confirm";
  const opt = {weekday: long ? "long" : "short", day:"numeric", month:"long"};
  if (!o.end) return D(o.date).toLocaleDateString("en-IE", opt);
  return D(o.date).toLocaleDateString("en-IE",{weekday:"short",day:"numeric"}) + " to " + D(o.end).toLocaleDateString("en-IE",{weekday:"short",day:"numeric",month:"long"});
};
const TODAY = (() => { const d = new Date(); d.setHours(12,0,0,0); return d; })();
const played = o => !!(o.results || o.teams || o.prizes);
const status = o => {
  const a = D(o.date), b = D(o.end || o.date);
  if (TODAY >= a && TODAY <= b) return "now";
  return b < TODAY ? "past" : "future";
};
const NEXT = OUTINGS.find(o => !o.trip && status(o) === "future");
const LIVE = OUTINGS.find(o => status(o) === "now");

const outingName = o => o.title ? `${o.venue}, ${o.title}` : o.venue;

function computeCup(){
  const rows = [
    ...Object.entries(SHEET).map(([name, vals]) => ({name, vals, total: vals.reduce((a,v) => a + (v||0), 0)})),
    ...Object.entries(PARTIAL).map(([name, v]) => ({name, vals:[...v,"?","?"], total: v.reduce((a,x) => a + (x||0), 0), partial:true}))
  ].sort((a,b) => b.total-a.total || a.name.localeCompare(b.name));
  rows.forEach(r => {
    const first = rows.findIndex(x => x.total === r.total);
    r.rank = first+1;
    r.pos = (rows.filter(x => x.total === r.total).length > 1 ? "T" : "") + r.rank;
  });
  return rows;
}
const CUP = computeCup();
const CUP_BY_NAME = Object.fromEntries(CUP.map(r => [r.name, r]));
const playedCount = r => r.vals.filter(v => typeof v === "number").length;

function allMembers(){
  const s = new Set([...EXTRA_MEMBERS, ...Object.keys(SHEET), ...Object.keys(PARTIAL)]);
  for (const o of OUTINGS){
    o.results?.forEach(([p]) => s.add(p));
    o.teams?.forEach(t => t.players.forEach(p => s.add(p)));
    o.specials?.forEach(x => s.add(x.player));
    o.prizes?.forEach(([,p]) => s.add(p));
    o.overall?.forEach(p => s.add(p));
  }
  const surname = n => n.split(" ").slice(1).join(" ").replace("'","");
  return [...s].sort((a,b) => surname(a).localeCompare(surname(b)) || a.localeCompare(b));
}

    document.querySelectorAll(".lb tr.detail").forEach(d => d.remove());
    document.querySelectorAll(".lb td.pl button").forEach(b => b.setAttribute("aria-expanded","false"));
    if (open) return;
    const r = CUP[+btn.dataset.i];
    const items = CUP_COLS.map((c,j) => typeof r.vals[j] === "number" ? `<li><b>${esc(c.label)}</b>: ${r.vals[j]} pts</li>` : "").join("") + (r.partial ? `<li>Connemara not added yet</li>` : "");

    d.innerHTML = `<td colspan="${CUP_COLS.length+3}"><ul>${items}<li><a href="#/player/${slug(r.name)}">Full season</a></li></ul></td>`;
    tr.after(d);
    btn.setAttribute("aria-expanded","true");
  }));
}

    document.querySelectorAll("#ml .m").forEach(m => { const ok = m.dataset.name.includes(v); m.style.display = ok?"":"none"; shown += ok; });
    document.getElementById("none").hidden = shown > 0;
  });
}

/* ---- Player ---- */
function finishAt(name, o, j){
  if (o.results){ const i = o.results.findIndex(([p]) => p === name); if (i >= 0) return ord(i+1) + (o.results[i][1] ? `, ${o.results[i][1]} pts` : ""); }
  if (o.teams){ const i = o.teams.findIndex(t => t.players.includes(name)); if (i >= 0) return `${ord(i+1)} team (${esc(o.teams[i].captain)}'s)`; }
  if (o.prizes){
    const day = j === 7 ? "Saturday" : "Sunday";
    const wins = o.prizes.filter(([l,p]) => p === name && l.startsWith(day)).map(([l]) => "Won " + l.replace(day+" ","")).join(", ");
    const ov = j === 8 && o.overall.includes(name) ? "Overall two-day winner" : "";
    return [wins, ov].filter(Boolean).join(". ") || "Played";
  }
  return "Played";
}
function viewPlayer(s){
  const name = allMembers().find(n => slug(n) === s);
  if (!name) return `<h1>Player not found</h1><p class="lede">That name isn't on the members list. <a href="#/members">Back to members</a></p>`;
  const r = CUP_BY_NAME[name];
  const rows = r ? CUP_COLS.map((c,j) => {
    const v = r.vals[j]; const o = OUTINGS.find(x => x.id === c.outing);
    if (c.upcoming) return `<tr class="dim"><td>${esc(c.label)}</td><td>Still to play</td><td class="n"></td></tr>`;
    if (v === "?") return `<tr class="dim"><td>${esc(c.label)}</td><td>Not added yet</td><td class="n">?</td></tr>`;
    if (v == null) return `<tr class="dim"><td>${esc(c.label)}</td><td>Didn't play</td><td class="n"></td></tr>`;
    return `<tr><td>${esc(c.label)}</td><td>${finishAt(name,o,j)}</td><td class="n cup">${v}</td></tr>`;
  }).join("") : "";
  const wins = OUTINGS.filter(o => o.results?.[0]?.[0] === name || o.teams?.[0]?.players.includes(name) || o.overall?.includes(name));
  return `
    <p class="crumb"><a href="#/members">Members</a></p>
    <h1>${esc(name)}</h1>
    <p class="lede">${[ROLES[name], JOINED[name] ? "Joined at " + JOINED[name] : ""].filter(Boolean).map(esc).join(". ") || "Mayo Knights member"}</p>
    ${r ? `<div class="pstats">
      <div><b>${r.pos}</b><span>on the Cup</span></div>
      <div><b>${r.total}</b><span>Cup points</span></div>
      <div><b>${playedCount(r)}</b><span>rounds played</span></div>
      <div><b>${wins.length}</b><span>${wins.length===1?"win":"wins"}</span></div>
    </div>
    <table class="res season-t"><thead><tr><th>Round</th><th>Finish</th><th class="n">Cup</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<p class="empty-state">No Cup points on record yet. They'll show here after their first outing.</p>`}`;
}

/* ---- Honours ---- */
function viewHonours(){
  const leader = CUP[0];
  return `
    <h1>Roll of honour</h1>
    <p class="lede">The society's captains and trophy winners.</p>
    <div class="honours">
      ${HONOURS.map(h => `<section class="honour">
        <h2>${esc(h.title)}</h2>
        <table class="res"><tbody>
          ${h.rows.map(([y,n]) => `<tr><td class="p">${y}</td><td>${n ? nameLink(n) : `In progress. ${nameLink(leader.name)} leads on ${leader.total} with two rounds to go.`}</td></tr>`).join("")}
        </tbody></table>
      </section>`).join("")}
    </div>
    <p class="empty-state">Earlier years still to add. Send past captains and winners to whoever runs the site.</p>`;
}

/* ===== ROUTER ===== */
function route(){
  const [, page="", sub] = (location.hash || "#/").split("/");
  const app = document.getElementById("app");
  const views = {"":viewHome, leaderboard:viewLeaderboard, results:viewResults, outings:viewOutings, members:viewMembers, honours:viewHonours, player:() => viewPlayer(sub)};
  app.innerHTML = (views[page] || viewHome)();
  const navPage = page === "player" ? "members" : page;
  document.querySelectorAll("nav a").forEach(a => a.getAttribute("href") === "#/" + navPage ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  if (page === "leaderboard") wireLeaderboard();
  if (page === "members") wireMembers();
  const titles = {"":"Home", leaderboard:"Leaderboard", results:"Results", outings:"Outings", members:"Members", honours:"Roll of honour", player:"Player"};
  document.title = (titles[page] || "Home") + ", Mayo Knights Golf Society";
  if (sub && page === "results") document.getElementById("r-" + sub)?.scrollIntoView(); else window.scrollTo(0,0);
}
addEventListener("hashchange", route);
route();
</script>
